name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (engine)
        run: npm run test:engine

      - name: npm audit (high+ fails the build, §60)
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t kaiyuan-liuyao:ci .
