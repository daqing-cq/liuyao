name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 应用层 typecheck 通过 npm workspace 引用 liuyao-engine 的 dist/ 产物，
      # 而 dist/ 不入库（.gitignore），须先构建引擎（与 Dockerfile 的 engine 阶段一致）
      - name: Build engine (dist for typecheck)
        run: npm run build --workspace liuyao-engine

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (engine)
        run: npm run test:engine

      - name: npm audit (high+ fails the build, §60)
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t kaiyuan-liuyao:ci .
